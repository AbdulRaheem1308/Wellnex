name: Web Frontend CD (Firebase)

on:
  push:
    branches:
      - main
    paths:
      - 'wellnex_website/**'
      - 'wellnex_admin/frontend/**'
      - '.github/workflows/frontend-cd.yml'
      - 'firebase.json'
      - '.firebaserc'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build Main Website
        working-directory: ./wellnex_website
        run: |
          npm ci
          npm run build

      - name: Build Admin Portal
        working-directory: ./wellnex_admin/frontend
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --project wellnex-8bc04 --force
